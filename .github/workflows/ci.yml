name: CuraMate CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build production frontend
        env:
          VITE_RULES_API_URL: ${{ vars.VITE_RULES_API_URL }}
          VITE_DIAGNOSIS_API_URL: ${{ vars.VITE_DIAGNOSIS_API_URL }}
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: curamate-dist
          path: dist/
